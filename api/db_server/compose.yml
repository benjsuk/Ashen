services:
  db:
    image: mysql:latest
    ports:
      - 5905:3306
    volumes:
      - ./db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: .db.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  my-db-volume:
